<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0D47A1"/>
<title>Checklist Leadec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#0a1628,#1a2744,#0d1f3c);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
.header{background:linear-gradient(135deg,#1565C0,#0D47A1);padding:24px 20px 20px;border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(13,71,161,.4)}
.header-top{display:flex;align-items:center;gap:12px}
.header-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.date{font-size:12px;color:rgba(255,255,255,.7);text-transform:capitalize}
.progress{margin-top:16px}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.8);margin-bottom:6px}
.progress-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.tasks{padding:16px 16px 240px}
.task{border-radius:16px;padding:16px;margin-bottom:12px;transition:all .3s ease}
.task-header{display:flex;align-items:center;justify-content:space-between}
.task-info{display:flex;align-items:center;gap:12px;flex:1}
.task-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.task-name{font-size:15px;font-weight:600}
.task-time{margin-top:2px;font-size:12px}
.task-note{font-size:11px;color:rgba(255,179,0,.7);margin-top:2px}
.cam-btn{border:none;border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s}
.photo-wrap{margin-top:12px;position:relative}
.photo-wrap img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid rgba(76,175,80,.3)}
.photo-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:8px 16px 16px;background:linear-gradient(transparent,#0a1628 20%);padding-top:30px}
.btn{width:100%;border:none;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:700;font-family:inherit;margin-bottom:6px;padding:14px;font-size:14px}
.config{margin-top:16px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2)}
.config label{font-size:12px;color:rgba(255,255,255,.7);display:block;margin-top:8px}
.config input{width:100%;padding:8px 12px;margin-top:4px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px}
.cfg-btn{position:absolute;right:20px;top:28px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.12);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.day-off{opacity:.4;pointer-events:none}
.day-off .task-note{color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ALL_TASKS=[
{id:1,name:"Limpieza Directores",icon:"\u{1F451}",time:"6:00 AM",days:null},
{id:2,name:"Limpieza Pasillo de la Muerte",icon:"\u26A0\uFE0F",time:"7:00 AM",days:null},
{id:3,name:"Riego de Laureles",icon:"\u{1F33F}",time:"8:00 AM",days:null},
{id:4,name:"Riego Palmas",icon:"\u{1F334}",time:"8:00 AM",days:[3,6],note:"Solo mi\u00e9rcoles y s\u00e1bado"},
{id:5,name:"Limpieza Exterior Muro Norte",icon:"\u{1F9F9}",time:"8:00 AM",days:null},
{id:6,name:"Limpieza Exterior Muro Sur",icon:"\u{1F9F9}",time:"8:00 AM",days:null}
];
const EMAILS=['moises.gastelum@leadec-services.com','arturo.herrera@leadec-services.com'];
const dayNames=['domingo','lunes','martes','mi\u00e9rcoles','jueves','viernes','s\u00e1bado'];
let tasks=[],sent=false,showCfg=false;
let myPhone=localStorage.getItem('myPhone')||'';
function getToday(){return new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function getTime(){return new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
function getDow(){return new Date().getDay()}
function loadTasks(){
const dow=getDow();
const today=ALL_TASKS.filter(t=>!t.days||t.days.includes(dow));
tasks=today.map(t=>({...t,done:false,photo:null,completedAt:null}));
}
loadTasks();
function render(){
const cc=tasks.filter(t=>t.done).length,all=cc===tasks.length&&tasks.length>0,pct=tasks.length?Math.round(cc/tasks.length*100):0;
let h=`<div class="header" style="position:relative">
<div class="header-top"><div class="header-icon">\u{1F4CB}</div><div><h1>Checklist Leadec</h1><p class="date">${getToday()}</p></div></div>
<button class="cfg-btn" onclick="toggleCfg()">\u2699\uFE0F</button>`;
if(showCfg)h+=`<div class="config">
<label>Mi n\u00famero WhatsApp (con c\u00f3digo de pa\u00eds):</label>
<input value="${myPhone}" placeholder="5216861234567" oninput="savePhone(this.value)"/>
<p style="font-size:11px;color:rgba(255,255,255,.5);margin-top:6px">\u{1F4A1} El reporte se env\u00eda a tu n\u00famero y t\u00fa lo reenv\u00edas al director</p>
</div>`;
h+=`<div class="progress"><div class="progress-info"><span>${cc} de ${tasks.length} actividades hoy</span><span>${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${all?'linear-gradient(90deg,#4CAF50,#66BB6A)':'linear-gradient(90deg,#FFB300,#FFA000)'}"></div></div></div></div><div class="tasks">`;
tasks.forEach((t,i)=>{
const bg=t.done?'linear-gradient(135deg,rgba(76,175,80,.12),rgba(76,175,80,.06))':'rgba(255,255,255,.05)';
const bd=t.done?'1px solid rgba(76,175,80,.3)':'1px solid rgba(255,255,255,.08)';
const ic_bg=t.done?'linear-gradient(135deg,#4CAF50,#388E3C)':'rgba(255,255,255,.08)';
const cam_bg=t.done?'rgba(76,175,80,.2)':'linear-gradient(135deg,#1565C0,#0D47A1)';
h+=`<div class="task" style="background:${bg};border:${bd}"><div class="task-header"><div class="task-info"><div class="task-icon" style="background:${ic_bg}">${t.done?'\u2705':t.icon}</div><div><p class="task-name" style="color:${t.done?'#81C784':'#E3F2FD'}">${t.name}</p><p class="task-time" style="color:${t.done?'rgba(129,199,132,.7)':'rgba(255,255,255,.4)'}">${t.done?'Completada: '+t.completedAt:'Objetivo: '+t.time}</p>${t.note?`<p class="task-note">${t.note}</p>`:''}</div></div><button class="cam-btn" style="background:${cam_bg}" onclick="document.getElementById('f${t.id}').click()">\u{1F4F7}</button><input type="file" id="f${t.id}" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(${i},this)"/></div>`;
if(t.photo)h+=`<div class="photo-wrap"><img src="${t.photo}" alt="${t.name}"/><button class="photo-del" onclick="delPhoto(${i})">\u2715</button></div>`;
h+=`</div>`;
});
h+=`</div><div class="bottom">`;
if(cc>0)h+=`<button class="btn" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8)" onclick="sharePhotos()">\u{1F4E4} Compartir ${cc} foto${cc>1?'s':''}</button>`;
const dis=cc===0;
const bg2=dis?'rgba(255,255,255,.1)':all?'linear-gradient(135deg,#25D366,#128C7E)':'linear-gradient(135deg,#FFB300,#F57F17)';
const txt=sent?'\u2705 Reporte enviado':all?'Enviar reporte por WhatsApp':cc===0?'Toma fotos para enviar reporte':`Enviar reporte (${cc}/${tasks.length}) por WhatsApp`;
h+=`<button class="btn" style="background:${bg2};color:${dis?'rgba(255,255,255,.3)':'#fff'};cursor:${dis?'not-allowed':'pointer'};font-size:15px" onclick="${dis?'':'sendWA()'}"><span style="font-size:20px">${sent?'\u2705':'\u{1F4F1}'}</span>${txt}</button>`;
if(cc>0)h+=`<button class="btn" style="background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff;font-size:13px" onclick="sendEmail()"><span style="font-size:18px">\u{1F4E7}</span>Enviar reporte ejecutivo por correo</button>`;
h+=`</div>`;
document.getElementById('app').innerHTML=h;
}
function addPhoto(i,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{tasks[i].photo=e.target.result;tasks[i].done=true;tasks[i].completedAt=getTime();render()};r.readAsDataURL(f)}
function delPhoto(i){tasks[i].photo=null;tasks[i].done=false;tasks[i].completedAt=null;render()}
function toggleCfg(){showCfg=!showCfg;render()}
function savePhone(v){myPhone=v;localStorage.setItem('myPhone',v)}
function sendWA(){
if(!myPhone){toggleCfg();alert('Configura tu n\u00famero de WhatsApp primero');return}
const sep='\u2500'.repeat(28);
const cc=tasks.filter(t=>t.done).length;
const hd=`\u2705 *REPORTE DIARIO DE OPERACIONES*\n\u{1F3ED} *LEADEC - KENMEX*\n\u{1F4C5} ${getToday()}\n\u23F0 Enviado: ${getTime()}\n${sep}`;
const bd=tasks.map(t=>`${t.done?'\u2705':'\u274C'} *${t.name}*\n    ${t.done?'Completada: '+t.completedAt:'Pendiente'}`).join('\n\n');
const ft=`\n${sep}\n\u{1F4CA} *Cumplimiento: ${cc}/${tasks.length} (${Math.round(cc/tasks.length*100)}%)*\n\n_Fotos de evidencia en los siguientes mensajes._`;
window.open(`https://wa.me/${myPhone}?text=${encodeURIComponent(hd+'\n\n'+bd+ft)}`,'_blank');
sent=true;render()
}
function sharePhotos(){
const photos=tasks.filter(t=>t.photo);if(!photos.length)return;
if(navigator.share&&navigator.canShare){
Promise.all(photos.map(async(t)=>{const r=await fetch(t.photo);const b=await r.blob();return new File([b],t.name.replace(/\s/g,'_')+'.jpg',{type:'image/jpeg'})}))
.then(files=>{if(navigator.canShare({files}))navigator.share({title:'Evidencias Checklist Leadec',text:'Fotos - '+getToday(),files}).catch(()=>{})}).catch(()=>{})
}}
function sendEmail(){
const cc=tasks.filter(t=>t.done).length;
const pct=Math.round(cc/tasks.length*100);
const today=getToday();
const time=getTime();
const subject=encodeURIComponent(`Reporte Ejecutivo - Cumplimiento Actividades Prioritarias - ${today}`);
const lines=tasks.map(t=>`${t.done?'\u2705':'\u274C'} ${t.name} - ${t.done?'Completada '+t.completedAt:'Pendiente (objetivo: '+t.time+')'}`).join('%0A');
const body=encodeURIComponent(
`REPORTE EJECUTIVO DE CUMPLIMIENTO\nACTIVIDADES PRIORITARIAS - LEADEC / KENMEX\n${today}\nHora de reporte: ${time}\n${'─'.repeat(40)}\n\nRESUMEN:\nActividades programadas: ${tasks.length}\nActividades completadas: ${cc}\nCumplimiento: ${pct}%\n\n${'─'.repeat(40)}\nDETALLE:\n\n${tasks.map(t=>`${t.done?'[COMPLETADA]':'[PENDIENTE]'} ${t.name}\n  Hora objetivo: ${t.time}\n  ${t.done?'Hora completada: '+t.completedAt:'Status: Sin completar'}\n`).join('\n')}\n${'─'.repeat(40)}\n\nNota: Las fotos de evidencia fueron enviadas por WhatsApp.\n\nAtentamente,\nOperaciones Leadec`
);
const to=EMAILS.join(',');
window.open(`mailto:${to}?subject=${subject}&body=${body}`,'_blank');
}
render();
</script>
</body>
</html>
